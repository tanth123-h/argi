name: chaona_app
description: ชาวนา — AI Smart Farming Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.0

  # Charts
  fl_chart: ^0.68.0

  # Local storage (encrypted)
  flutter_secure_storage: ^9.0.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Image handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  image: ^4.2.0

  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.1

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Voice input
  speech_to_text: ^7.0.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  equatable: ^2.0.5

  # AI — Google Gemini
  google_generative_ai: ^0.4.6

  # IoT — MQTT (Arduino UNO R4 sensor)
  mqtt_client: ^10.4.0

  # Maps (Option 1: Google Maps - free tier available)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  maps_toolkit: ^2.0.1
  
  # Maps (Option 2: OpenStreetMap - completely FREE, no API key!)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # HTTP for market prices
  http: ^1.2.2

  # App links (deep linking)
  app_links: ^6.3.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/chaona_mascot.png
    - assets/images/
    - assets/images/mascot/
    - assets/demo/
